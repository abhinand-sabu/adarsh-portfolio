# Netlify Configuration for Adarsh Portfolio
[build]
  command = "npm run build"
  publish = "dist"

# SPA Single Page App redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for web application
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
